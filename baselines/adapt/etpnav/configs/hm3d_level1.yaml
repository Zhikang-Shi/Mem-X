ENVIRONMENT:
  MAX_EPISODE_STEPS: 300
  ITERATOR_OPTIONS:
    SHUFFLE: False
    GROUP_BY_SCENE: False

SIMULATOR:
  ACTION_SPACE_CONFIG: v0
  AGENT_0:
    HEIGHT: 1.2
    RADIUS: 0.1
    SENSORS: [RGB_SENSOR, DEPTH_SENSOR]
  FORWARD_STEP_SIZE: 0.25
  TURN_ANGLE: 15
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
    ALLOW_SLIDING: True
  RGB_SENSOR:
    WIDTH: 224
    HEIGHT: 224
    HFOV: 90
    POSITION: [0.0, 1.2, 0.0]
    TYPE: HabitatSimRGBSensor
  DEPTH_SENSOR:
    WIDTH: 256
    HEIGHT: 256
    HFOV: 90
    POSITION: [0.0, 1.2, 0.0]
    MIN_DEPTH: 0.0
    MAX_DEPTH: 10.0
    NORMALIZE_DEPTH: False
  TYPE: Sim-v1
  SCENE_DATASET: @SCENE_DATASET_CONFIG@

TASK:
  TYPE: VLN-v0
  SUCCESS_DISTANCE: 3.0
  SENSORS:
    - INSTRUCTION_SENSOR
  INSTRUCTION_SENSOR_UUID: instruction
  POSSIBLE_ACTIONS: [STOP, MOVE_FORWARD, TURN_LEFT, TURN_RIGHT, HIGHTOLOW]
  MEASUREMENTS: []
  SUCCESS:
    SUCCESS_DISTANCE: 3.0
  SPL:
    SUCCESS_DISTANCE: 3.0
  NDTW:
    SUCCESS_DISTANCE: 3.0
    GT_PATH: @DATASET_DIR@/level1/habitat/level1_{split}_gt.json.gz
  SDTW:
    SUCCESS_DISTANCE: 3.0
    GT_PATH: @DATASET_DIR@/level1/habitat/level1_{split}_gt.json.gz
  ORACLE_SUCCESS:
    SUCCESS_DISTANCE: 3.0

DATASET:
  TYPE: VLN-CE-v1
  SPLIT: ep0
  DATA_PATH: @DATASET_DIR@/level1/habitat/level1_{split}.json.gz
  SCENES_DIR: @SCENES_DIR@
