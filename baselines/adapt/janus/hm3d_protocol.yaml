# Shared Mem-X protocol camera and discrete Janus actions, Habitat 0.1.7.
ENVIRONMENT:
  MAX_EPISODE_STEPS: 300
  ITERATOR_OPTIONS:
    SHUFFLE: False
    GROUP_BY_SCENE: False

SIMULATOR:
  TYPE: Sim-v0
  ACTION_SPACE_CONFIG: v0
  AGENT_0:
    HEIGHT: 1.2
    RADIUS: 0.1
    SENSORS: [RGB_SENSOR, DEPTH_SENSOR]
  FORWARD_STEP_SIZE: 0.25
  TURN_ANGLE: 30
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
    ALLOW_SLIDING: True
  RGB_SENSOR:
    TYPE: HabitatSimRGBSensor
    WIDTH: 960
    HEIGHT: 720
    HFOV: 90
    POSITION: [0.0, 1.2, 0.0]
  DEPTH_SENSOR:
    TYPE: HabitatSimDepthSensor
    WIDTH: 960
    HEIGHT: 720
    HFOV: 90
    POSITION: [0.0, 1.2, 0.0]
    MIN_DEPTH: 0.0
    MAX_DEPTH: 10.0
    NORMALIZE_DEPTH: False

TASK:
  TYPE: VLN-v0
  SENSORS: []
  POSSIBLE_ACTIONS: [STOP, MOVE_FORWARD, TURN_LEFT, TURN_RIGHT]
  MEASUREMENTS: [DISTANCE_TO_GOAL, SUCCESS, SPL]
  SUCCESS:
    SUCCESS_DISTANCE: 3.0

DATASET:
  TYPE: MemX-Janus-v1
  SPLIT: ep0
  CONTENT_SCENES: ['*']
